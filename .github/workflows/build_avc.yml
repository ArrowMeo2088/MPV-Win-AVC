name: build_avc

on:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/build_avc.yml'
      - 'ci/build-avc-msys2.sh'
      - 'etc/mpv-avc-kernel.conf'
      - 'BUILD_AVC.md'
      - 'meson.build'
      - 'meson.options'
      - 'MPV_VERSION'
      - 'sub/ass_stub.c'
      - 'sub/ass.h'
      - 'sub/ass_types.h'
      - 'patches/**'
      - '**/*.c'
      - '**/*.h'
      - '**/*.build'
  workflow_dispatch:

concurrency:
  group: build-avc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mingw64:
    runs-on: windows-latest

    steps:
      - name: Checkout MPV-Win-AVC
        uses: actions/checkout@v4
        with:
          path: mpv

      - name: Checkout FFmpeg-Win-AVC-DLL
        uses: actions/checkout@v4
        with:
          repository: ArrowMeo2088/FFmpeg-Win-AVC-DLL
          path: ffmpeg

      - name: Cache FFmpeg build tree
        uses: actions/cache@v4
        with:
          path: ffmpeg/build/win-x64-static
          key: ffmpeg-avc-static-v3-${{ hashFiles('ffmpeg/scripts/configure-avc-dash-mingw-static.sh') }}
          restore-keys: |
            ffmpeg-avc-static-v3-

      - name: Cache FFmpeg install prefix
        uses: actions/cache@v4
        with:
          path: ffmpeg/dist/ffmpeg-win-x64-static/prefix
          key: ffmpeg-avc-prefix-v3-${{ hashFiles('ffmpeg/scripts/configure-avc-dash-mingw-static.sh') }}
          restore-keys: |
            ffmpeg-avc-prefix-v3-

      - name: Cache MPV build tree
        uses: actions/cache@v4
        with:
          path: mpv/build
          key: mpv-avc-build-v3-${{ hashFiles('mpv/ci/build-avc-msys2.sh', 'mpv/meson.build') }}
          restore-keys: |
            mpv-avc-build-v3-

      - name: Setup MSYS2 MINGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libvpl
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-libplacebo
            mingw-w64-x86_64-shaderc
            mingw-w64-x86_64-spirv-cross
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            make
            diffutils

      - name: Preflight FFmpeg prefix
        shell: msys2 {0}
        working-directory: mpv
        env:
          FFMPEG_SRC: ../ffmpeg
        run: |
          bash ../ffmpeg/scripts/build-win-mingw-static.sh
          export PKG_CONFIG_PATH="$(cd ../ffmpeg/dist/ffmpeg-win-x64-static/prefix && pwd)/lib/pkgconfig"
          export PKG_CONFIG="pkg-config --static"
          pkg-config --print-errors --exists libavcodec libavformat libavutil libplacebo
          ls ../ffmpeg/dist/ffmpeg-win-x64-static/prefix/lib/*.a

      - name: Build libmpv (FFmpeg static + DASH)
        shell: msys2 {0}
        working-directory: mpv
        env:
          FFMPEG_SRC: ../ffmpeg
          MPV_PACK_MODE: ldd
          MPV_LTO: 'false'
          MPV_SKIP_PACMAN: '1'
        run: bash ./ci/build-avc-msys2.sh

      - name: Print logs on failure
        if: failure()
        shell: msys2 {0}
        working-directory: mpv
        run: |
          export PKG_CONFIG_PATH="$(cd ../ffmpeg/dist/ffmpeg-win-x64-static/prefix && pwd)/lib/pkgconfig"
          export PKG_CONFIG="pkg-config --static"
          pkg-config --libs --static libavformat | head -c 500 || true
          echo
          if [[ -f build/meson-logs/meson-log.txt ]]; then
            tail -n 200 build/meson-logs/meson-log.txt
          fi
          if [[ -f build/meson-logs/meson-setup.txt ]]; then
            tail -n 100 build/meson-logs/meson-setup.txt
          fi
          if [[ -f ../ffmpeg/build/win-x64-static/ffbuild/config.log ]]; then
            tail -n 200 ../ffmpeg/build/win-x64-static/ffbuild/config.log
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpv-win-avc-x64-${{ github.run_number }}
          path: mpv/dist/mpv-win-avc-x64/
          retention-days: 30
          if-no-files-found: error
