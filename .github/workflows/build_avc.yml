name: build_avc

on:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/build_avc.yml'
      - 'ci/build-avc-msys2.sh'
      - 'etc/mpv-avc-kernel.conf'
      - 'BUILD_AVC.md'
      - 'meson.build'
      - 'meson.options'
      - 'MPV_VERSION'
      - 'subprojects/**'
      - '**/*.c'
      - '**/*.h'
      - '**/*.build'
  workflow_dispatch:

concurrency:
  group: build-avc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mingw64:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 MINGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true

      - name: Build libmpv (AVC + DASH)
        shell: msys2 {0}
        run: bash ./ci/build-avc-msys2.sh

      - name: Print meson log on failure
        if: failure()
        shell: msys2 {0}
        run: |
          if [[ -f build/meson-logs/meson-log.txt ]]; then
            tail -n 200 build/meson-logs/meson-log.txt
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpv-win-avc-x64-${{ github.run_number }}
          path: dist/mpv-win-avc-x64/
          retention-days: 30
          if-no-files-found: error
