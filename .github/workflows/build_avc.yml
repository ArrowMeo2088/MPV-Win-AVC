name: build_avc

on:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/build_avc.yml'
      - 'ci/build-avc-msys2.sh'
      - 'etc/mpv-avc-kernel.conf'
      - 'BUILD_AVC.md'
      - 'meson.build'
      - 'meson.options'
      - 'MPV_VERSION'
      - 'sub/ass_stub.c'
      - 'sub/ass.h'
      - 'sub/ass_types.h'
      - 'patches/**'
      - '**/*.c'
      - '**/*.h'
      - '**/*.build'
  workflow_dispatch:

concurrency:
  group: build-avc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mingw64:
    runs-on: windows-latest

    steps:
      - name: Checkout MPV-Win-AVC
        uses: actions/checkout@v4
        with:
          path: mpv

      - name: Checkout FFmpeg-Win-AVC-DLL
        uses: actions/checkout@v4
        with:
          repository: ArrowMeo2088/FFmpeg-Win-AVC-DLL
          path: ffmpeg

      - name: Cache FFmpeg build tree
        uses: actions/cache@v4
        with:
          path: ffmpeg/build/win-x64-static
          key: ffmpeg-avc-static-${{ hashFiles('ffmpeg/scripts/configure-avc-dash-mingw-static.sh') }}
          restore-keys: |
            ffmpeg-avc-static-

      - name: Cache MPV build tree
        uses: actions/cache@v4
        with:
          path: mpv/build
          key: mpv-avc-build-${{ hashFiles('mpv/ci/build-avc-msys2.sh', 'mpv/meson.build') }}
          restore-keys: |
            mpv-avc-build-

      - name: Setup MSYS2 MINGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true

      - name: Build libmpv (FFmpeg static + DASH)
        shell: msys2 {0}
        env:
          FFMPEG_SRC: ${{ github.workspace }}/ffmpeg
          FFMPEG_DIST_DIR: ${{ github.workspace }}/ffmpeg/dist/ffmpeg-win-x64-static
          FFMPEG_PREFIX: ${{ github.workspace }}/ffmpeg/dist/ffmpeg-win-x64-static/prefix
          MPV_PACK_MODE: ldd
          MPV_LTO: 'false'
        run: bash ./mpv/ci/build-avc-msys2.sh
        working-directory: ${{ github.workspace }}

      - name: Print logs on failure
        if: failure()
        shell: msys2 {0}
        run: |
          if [[ -f mpv/build/meson-logs/meson-log.txt ]]; then
            tail -n 200 mpv/build/meson-logs/meson-log.txt
          fi
          if [[ -f ffmpeg/build/win-x64-static/ffbuild/config.log ]]; then
            tail -n 200 ffmpeg/build/win-x64-static/ffbuild/config.log
          fi
        working-directory: ${{ github.workspace }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpv-win-avc-x64-${{ github.run_number }}
          path: mpv/dist/mpv-win-avc-x64/
          retention-days: 30
          if-no-files-found: error
