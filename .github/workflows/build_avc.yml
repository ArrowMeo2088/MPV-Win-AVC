name: build_avc

on:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/build_avc.yml'
      - 'ci/build-avc-win32.ps1'
      - 'etc/mpv-avc-kernel.conf'
      - 'BUILD_AVC.md'
      - 'meson.build'
      - 'meson.options'
      - 'MPV_VERSION'
      - 'subprojects/**'
      - '**/*.c'
      - '**/*.h'
      - '**/*.build'
  workflow_dispatch:

concurrency:
  group: build-avc-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: C:\vcpkg
  CC: ccache clang
  CXX: ccache clang++
  CC_LD: lld-link
  CXX_LD: lld-link
  RUST_LD: lld-link
  WINDRES: llvm-rc
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_DIR: ${{ github.workspace }}\.ccache
  CCACHE_MAXSIZE: 500M

jobs:
  win64-avc:
    runs-on: windows-2025

    steps:
      - name: Disable autocrlf
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install meson
          winget install --accept-source-agreements --accept-package-agreements Ccache.Ccache NASM.NASM
          echo "$env:LOCALAPPDATA\Microsoft\WinGet\Links" >> $env:GITHUB_PATH

      - name: Install vcpkg packages
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            libvpl:x64-windows `
            libxml2:x64-windows-static `
            pkgconf:x64-windows

      - name: Find Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "Could not find a Visual Studio installation" }
          "VS=$vsPath" >> $env:GITHUB_ENV

      - name: Build libmpv (AVC + DASH)
        id: build
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object {
            $_ -ne 'C:\Program Files\LLVM\bin' -and `
            $_ -ne 'C:\Program Files\CMake\bin' -and `
            $_ -ne 'C:\Strawberry\c\bin'
          }) -join ';'
          $env:PATH += ';C:\Program Files\NASM'
          Import-Module "$env:VS\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $env:VS -SkipAutomaticLocation -DevCmdArguments "-arch=amd64 -host_arch=amd64"
          ./ci/build-avc-win32.ps1

      - name: Print meson log on failure
        if: failure() && steps.build.outcome == 'failure'
        shell: pwsh
        run: |
          if (Test-Path build/meson-logs/meson-log.txt) {
            Get-Content build/meson-logs/meson-log.txt
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpv-win-avc-x64-${{ github.run_number }}
          path: dist/mpv-win-avc-x64/
          retention-days: 30
          if-no-files-found: error
