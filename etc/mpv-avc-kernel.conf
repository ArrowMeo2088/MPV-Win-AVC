# Recommended defaults for mpv-kernel (Richasy.MpvKernel) + Bili.NetF.
# Load before mpv_initialize, or set equivalent options via MpvClient API.

vo=gpu
gpu-api=d3d11
gpu-context=d3d11
# Intel QSV is provided by FFmpeg h264_qsv (not mpv d3d11va/nvdec).
hwdec=no
ao=wasapi

load-scripts=no
ytdl=no

# No subtitles / OSD (Bili.NetF does not use mpv text overlay).
osd-level=0
sub-auto=no
subs-fallback=no
sub-visibility=no

# HTTP / DASH (Bilibili): set per-request via MpvPlayOptions.HttpHeaders / UserAgent.
# cookies=yes can be set when MpvPlayOptions.EnableCookies is true.
